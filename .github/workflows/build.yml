name: Build Twoyi Android Container

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      include_rootfs:
        description: 'Include official rootfs.7z ROM inside APK'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            app/rs/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-xdk
        run: |
          if ! command -v cargo-xdk &> /dev/null; then
            cargo install --git https://github.com/tiann/cargo-xdk
          fi

      - name: Setup Android NDK (r21e)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: true
          link-to-sdk: true

      - name: Configure NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Prepare Rootfs Assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_rootfs }}
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f "app/src/main/assets/rootfs.7z" ]; then
            echo "Downloading official rootfs.7z from Twoyi release..."
            curl -L -s -o /tmp/official_twoyi.apk https://github.com/twoyi/twoyi/releases/download/0.5.4/twoyi_0.5.4-03211927-release.apk
            unzip -q -p /tmp/official_twoyi.apk assets/rootfs.7z > app/src/main/assets/rootfs.7z
            unzip -q -p /tmp/official_twoyi.apk assets/rom.ini > app/src/main/assets/rom.ini 2>/dev/null || true
            rm -f /tmp/official_twoyi.apk
          fi
          ls -lh app/src/main/assets/

      - name: Build Rust Native Library (libtwoyi.so)
        run: |
          cd app/rs
          cargo xdk -t arm64-v8a -o ../src/main/jniLibs build --release
          cd ../..
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build APK with Gradle
        env:
          SKIP_CARGO_BUILD: "true"
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Built APK
        run: |
          echo "Looking for output APKs:"
          ls -la app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
