plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    def buildSerial = new SimpleDateFormat("MMddHHmm").format(new Date())

    defaultConfig {
        applicationId "io.twoyi"
        minSdkVersion 27
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 27
        versionCode 10355
        versionName "0.5.5-${buildSerial}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a"
        }
        archivesBaseName = "twoyi_${versionName}"
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions "mode"

    productFlavors {
        slim {
            dimension "mode"
        }
        offline {
            dimension "mode"
        }
    }

    sourceSets {
        offline {
            assets.srcDirs = ['src/offline/assets']
        }
        slim {
            assets.srcDirs = ['src/slim/assets']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def flavor = variant.flavorName
            def buildType = variant.buildType.name
            output.outputFileName = "twoyi-${flavor}-${buildType}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

task cargoBuild {
    doLast {
        def targetSo = new File(project.projectDir, "src/main/jniLibs/arm64-v8a/libtwoyi.so")
        if (System.getenv("SKIP_CARGO_BUILD") == "true" && targetSo.exists()) {
            println("Skipping cargoBuild because SKIP_CARGO_BUILD=true and libtwoyi.so exists.")
            return
        }
        exec {
            // Switch to rs dir and run build script
            workingDir new File(project.projectDir, "rs")
            commandLine "sh", "build_rs.sh", "--release"
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith('javaPreCompile') && !task.name.contains('Test')) {
        task.dependsOn 'cargoBuild'
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'

    implementation 'com.github.tiann:FreeReflection:3.1.0'

    def libsuVersion = '3.2.1'
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"

    // AboutPage
    implementation 'com.github.medyo:android-about-page:1.2.4'
    implementation 'de.psdev.licensesdialog:licensesdialog:1.9.0'
    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'
    implementation 'com.github.fython:AlipayZeroSdk:1.1'

    implementation 'org.jdeferred:jdeferred-android-aar:1.2.4'
    implementation 'com.github.clans:fab:1.6.4'

    //noinspection GradleDependency
    implementation ('com.github.bumptech.glide:glide:4.9.0')
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    annotationProcessor 'androidx.annotation:annotation:1.3.0'

    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'org.tukaani:xz:1.5'

    implementation 'com.github.hzy3774:AndroidP7zip:v1.7.2'
//    implementation "com.github.seven332.a7zip:extract:master-SNAPSHOT"
//    implementation 'com.github.omicronapps:7-Zip-JBinding-4Android:Release-16.02-2.02'
//    implementation 'com.victor:lib:1.0.4'
    implementation 'com.cleveroad:androidmanimation:0.9.1'

    def appCenterSdkVersion = '4.3.1'
    implementation "com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}"
    implementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"

//    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}